<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <!-- ১. পেমেন্ট ও ভেরিফিকেশন গেটওয়ে স্ক্রিন -->
    <div id="paymentScreen" class="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-slate-100 p-6 text-center">
      
      <!-- ৫ মিনিটের কাউন্টডাউন টাইমার -->
      <div class="mb-3 inline-flex items-center px-3 py-1.5 bg-rose-50 border border-rose-200 text-rose-600 rounded-full text-xs font-semibold">
        ⏱️ পেমেন্টের সময় বাকি: <span id="paymentTimer" class="ml-1 text-sm font-bold text-rose-700">05:00</span>
      </div>

      <h2 class="text-xl font-bold text-slate-800">পেমেন্ট সম্পন্ন করুন</h2>
      <p class="text-xs text-slate-500 mt-1">প্রবেশ করতে নিচে দেওয়া QR কোডে ১০ টাকা সেন্ড মানি/পেমেন্ট করুন</p>
      
      <!-- নির্ধারিত ফি -->
      <div class="my-3 p-2.5 bg-amber-50 rounded-2xl border border-amber-200">
        <span class="text-xs text-amber-700 block font-medium">নির্ধারিত ফি</span>
        <span class="text-2xl font-black text-amber-600">১০.০০ টাকা</span>
      </div>
      
      <!-- Dynamic QR কোড -->
      <div class="flex justify-center my-3">
        <img id="qrBanners" 
             src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=00020101021126460008TallyPay010203020410050316910052126495261052045411540510.0053030505802BD5905Roman6007Barisal62280312ST12649526100708000000016304B54E" 
             alt="10 Tk Bangla QR Code" 
             class="w-full max-w-[280px] rounded-xl border border-slate-200 shadow-sm p-2 bg-white">
      </div>

      <!-- ইনপুট ফর্ম -->
      <div class="space-y-3 mt-4 text-left">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">পেমেন্ট মেথড নির্বাচন করুন</label>
          <select id="paymentMethod" onchange="updatePlaceholder()" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-medium bg-white">
            <option value="">মেথড বেছে নিন</option>
            <option value="bKash">বিকাশ (১০ ক্যারেক্টার)</option>
            <option value="Nagad">নগদ (৮ ক্যারেক্টার)</option>
            <option value="Tap">ট্যাপ - Tap (১৪ ক্যারেক্টার)</option>
            <option value="TrustBank">ট্রাস্ট ব্যাংক - Trace No. (১৬ ডিজিট)</option>
            <option value="Upay">উপায় - Upay (২৬ ক্যারেক্টার)</option>
          </select>
        </div>

        <div>
          <label id="inputLabel" class="block text-xs font-semibold text-slate-600 mb-1">ট্রানজেকশন আইডি (TrxID / Track ID)</label>
          <input type="text" id="trxIdInput" placeholder="ট্রানজেকশন আইডি লিখুন" 
                 class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-semibold tracking-wider uppercase">
        </div>

        <button onclick="submitPayment()" id="submitBtn" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold py-3 rounded-xl transition shadow-md shadow-indigo-200 text-sm">
          সাবমিট করুন ও প্রবেশ করুন
        </button>
      </div>

      <p id="statusMsg" class="mt-3 text-xs font-medium text-slate-600 hidden text-center"></p>
    </div>

    <!-- JavaScript লজিক -->
    <script>
      var TARGET_URL = "https://megadealszone.github.io/bd/jpegtojpg.html";
      var paymentCountdownInterval = null;

      function updatePlaceholder() {
        var method = document.getElementById('paymentMethod').value;
        var inputLabel = document.getElementById('inputLabel');
        var inputField = document.getElementById('trxIdInput');

        if (method === 'TrustBank') {
          inputLabel.innerText = "Trace No. (১৬ ডিজিট শুধু সংখ্যা)";
          inputField.placeholder = "যেমন: 4409170138248526";
        } else if (method === 'bKash') {
          inputLabel.innerText = "ট্রানজেকশন আইডি (১০ ক্যারেক্টার)";
          inputField.placeholder = "যেমন: DIM6QW2OYS";
        } else if (method === 'Nagad') {
          inputLabel.innerText = "ট্রানজেকশন আইডি (৮ ক্যারেক্টার)";
          inputField.placeholder = "যেমন: 0006BZMU";
        } else if (method === 'Tap') {
          inputLabel.innerText = "ট্রানজেকশন আইডি (১৪ ক্যারেক্টার)";
          inputField.placeholder = "যেমন: SPR0TH22P829RX";
        } else if (method === 'Upay') {
          inputLabel.innerText = "ট্রানজেকশন আইডি (২৬ ক্যারেক্টার)";
          inputField.placeholder = "যেমন: 01M0M9P2967EF25D433BMWBF3V";
        } else {
          inputLabel.innerText = "ট্রানজেকশন আইডি (TrxID / Track ID)";
          inputField.placeholder = "ট্রানজেকশন আইডি লিখুন";
        }
      }

      window.onload = function() {
        checkExistingSession();
      };

      function checkExistingSession() {
        var accessExpiry = localStorage.getItem('accessExpiry');
        var now = new Date().getTime();

        if (accessExpiry && now < parseInt(accessExpiry)) {
          window.location.href = TARGET_URL;
        } else {
          localStorage.removeItem('accessExpiry');
          start5MinPaymentTimer();
        }
      }

      function start5MinPaymentTimer() {
        if (paymentCountdownInterval) clearInterval(paymentCountdownInterval);
        
        var paymentExpiry = localStorage.getItem('paymentTimerExpiry');
        var now = new Date().getTime();

        if (!paymentExpiry || now >= parseInt(paymentExpiry)) {
          paymentExpiry = now + (5 * 60 * 1000); // 5 Minutes
          localStorage.setItem('paymentTimerExpiry', paymentExpiry);
        }

        paymentCountdownInterval = setInterval(function() {
          var currentTime = new Date().getTime();
          var distance = parseInt(paymentExpiry) - currentTime;

          if (distance <= 0) {
            clearInterval(paymentCountdownInterval);
            document.getElementById('paymentTimer').innerText = "00:00";
            alert('পেমেন্টের ৫ মিনিট সময় শেষ হয়ে গেছে! পুনরায় পেজ রিফ্রেশ করুন।');
            localStorage.removeItem('paymentTimerExpiry');
            location.reload();
            return;
          }

          var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
          var seconds = Math.floor((distance % (1000 * 60)) / 1000);

          minutes = minutes < 10 ? '0' + minutes : minutes;
          seconds = seconds < 10 ? '0' + seconds : seconds;

          document.getElementById('paymentTimer').innerText = minutes + ":" + seconds;
        }, 1000);
      }

      function submitPayment() {
        var method = document.getElementById('paymentMethod').value;
        var trxId = document.getElementById('trxIdInput').value.trim();
        var statusMsg = document.getElementById('statusMsg');
        var submitBtn = document.getElementById('submitBtn');

        statusMsg.classList.remove('hidden');

        if (!method) {
          statusMsg.innerText = "অনুগ্রহ করে একটি পেমেন্ট মেথড নির্বাচন করুন!";
          statusMsg.className = "mt-3 text-xs font-medium text-rose-600 block text-center bg-rose-50 p-2.5 rounded-xl border border-rose-200";
          return;
        }

        var rules = {
          "bKash": { len: 10, numOnly: false },
          "Nagad": { len: 8, numOnly: false },
          "Tap": { len: 14, numOnly: false },
          "TrustBank": { len: 16, numOnly: true },
          "Upay": { len: 26, numOnly: false }
        };

        var rule = rules[method];

        if (!trxId || trxId.length !== rule.len) {
          statusMsg.innerText = "ভুল ট্রানজেকশন আইডি! " + method + "-এর আইডি অবশ্যই " + rule.len + " ক্যারেক্টারের হতে হবে।";
          statusMsg.className = "mt-3 text-xs font-medium text-rose-600 block text-center bg-rose-50 p-2.5 rounded-xl border border-rose-200";
          return;
        }

        if (rule.numOnly && !/^\d+$/.test(trxId)) {
          statusMsg.innerText = "ভুল ট্রেস নং! " + method + "-এর Trace No. অবশ্যই ১৬ ডিজিটের শুধু সংখ্যা হতে হবে।";
          statusMsg.className = "mt-3 text-xs font-medium text-rose-600 block text-center bg-rose-50 p-2.5 rounded-xl border border-rose-200";
          return;
        }

        statusMsg.innerText = "ভেরিফাই করা হচ্ছে...";
        statusMsg.className = "mt-3 text-xs font-medium text-indigo-600 block text-center";
        submitBtn.disabled = true;

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(function(response) {
              if (response.success) {
                var expiryTime = new Date().getTime() + (50 * 60 * 1000); // ৫০ মিনিট
                localStorage.setItem('accessExpiry', expiryTime);
                localStorage.removeItem('paymentTimerExpiry');
                
                window.location.href = TARGET_URL;
              } else {
                statusMsg.innerText = response.message;
                statusMsg.className = "mt-3 text-xs font-medium text-rose-600 block text-center bg-rose-50 p-2.5 rounded-xl border border-rose-200";
                submitBtn.disabled = false;
              }
            })
            .withFailureHandler(function(err) {
              statusMsg.innerText = "সার্ভার এরর: " + err.message;
              statusMsg.className = "mt-3 text-xs font-medium text-rose-600 block text-center bg-rose-50 p-2.5 rounded-xl border border-rose-200";
              submitBtn.disabled = false;
            })
            .processPaymentSystem_(method, trxId);
        } else {
          // Local testing fallback
          setTimeout(function() {
            var expiryTime = new Date().getTime() + (50 * 60 * 1000);
            localStorage.setItem('accessExpiry', expiryTime);
            localStorage.removeItem('paymentTimerExpiry');
            window.location.href = TARGET_URL;
          }, 1000);
        }
      }
    </script>
  </body>
</html>
