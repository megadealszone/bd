<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Document and Text</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Universal text rendering:
         English + Unicode Bengali + legacy Bengali font content.
         IMPORTANT: no !important here, so pasted/included font-family styles remain intact. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif:wght@400;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Script-aware fallback: English uses Noto Sans; Bengali falls through to Noto Sans Bengali.
           A child element's own font-family is NOT overridden. */
        html, body, input, textarea, button, select, option, [contenteditable="true"] {
            font-family: "Noto Sans", "Noto Sans Bengali", "Noto Serif", "Noto Serif Bengali", Arial, sans-serif;
            font-synthesis: none;
            font-variant-ligatures: normal;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        body { -webkit-text-size-adjust: 100%; }
        [contenteditable="true"], #dashboard-list, #modalBody {
            line-height: 1.75;
            word-break: normal;
            overflow-wrap: anywhere;
        }
        .bangla-unicode-safe {
            font-family: "Noto Sans", "Noto Sans Bengali", "Noto Serif", "Noto Serif Bengali", Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Navigation Bar -->
    <nav class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">ফাইল ও টেক্সট ম্যানেজমেন্ট সিস্টেম</h1>
        <div class="space-x-2">
            <a href="../jpegtojpg.html" id="btn-home" class="px-4 py-2 bg-blue-700 text-white rounded transition font-medium inline-block">হোম</a>
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="px-4 py-2 bg-blue-700 rounded transition font-medium">ড্যাশবোর্ড</button>
            <button onclick="switchTab('dataentry')" id="btn-dataentry" class="px-4 py-2 bg-blue-800 rounded transition font-medium">ডাটা এন্ট্রি</button>
            <button onclick="switchTab('admin')" id="btn-admin" class="px-4 py-2 bg-blue-800 rounded transition font-medium">অ্যাডমিন প্যানেল</button>
        </div>
    </nav>

    <div class="container mx-auto p-6 max-w-5xl">
        <!-- Dashboard Section -->
        <div id="section-dashboard" class="bg-white rounded-xl shadow p-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">ড্যাশবোর্ড (সংরক্ষিত টেক্সট ও ফাইলসমূহ)</h2>
            <div id="dashboard-list" class="space-y-6">
                <p class="text-gray-500">লোড হচ্ছে...</p>
            </div>
        </div>

        <!-- Public Data Entry Section -->
        <div id="section-dataentry" class="hidden">
            <div id="public-form-container"></div>
        </div>


        <!-- Admin Section -->
        <div id="section-admin" class="hidden space-y-6">
            <div id="admin-login-box" class="bg-white rounded-xl shadow p-6 max-w-md mx-auto">
                <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">অ্যাডমিন লগইন</h2>
                <div class="space-y-4">
                    <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড দিন (5101)" class="w-full border rounded px-3 py-2">
                    <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700">লগইন</button>
                </div>
            </div>

            <div id="admin-panel-content" class="hidden space-y-6">
                <!-- Data Entry Box for Admin -->
                <div id="admin-form-container"></div>

                <!-- Summary Box -->
                <div class="bg-white rounded-xl shadow p-6 border-2 border-indigo-200">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">সামারি ও ম্যানেজমেন্ট</h2>
                    <div id="summary-list" class="space-y-4">
                        <p class="text-gray-500">ডাটা লোড হচ্ছে...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Popup for Description View -->
    <div id="descModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-2xl w-full p-6 space-y-4 max-h-[85vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modalTitle" class="font-bold text-xl text-gray-800">ডেসক্রিপশন বিস্তারিত</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-600 font-bold text-lg">&times;</button>
            </div>
            <div id="modalBody" class="bangla-unicode-safe overflow-y-auto p-4 border rounded bg-gray-50 text-gray-800" style="white-space: pre-wrap;"></div>
            <div class="flex justify-between items-center pt-2">
                <button onclick="copyModalContent()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700 flex items-center gap-2">
                    <span id="modalCopyBtnText">কপি করুন</span>
                </button>
                <button onclick="closeModal()" class="bg-gray-500 text-white px-4 py-2 rounded text-sm font-medium hover:bg-gray-600">বন্ধ করুন</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbynqJ-OX2bfmtdOx54OnUPsFO_oAuh7-18KJAhqsJ1ii329a2f6s_lBTM3dbMoyw5Jl/exec"; 

        let allDataCache = [];

        window.onload = function() {
            renderDataEntryForm('public-form-container', 'public');
            renderDataEntryForm('admin-form-container', 'admin');
            ensureBijoyEngine().finally(() => loadDashboard());
        };

        function renderDataEntryForm(containerId, prefix) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = `
                <div class="bg-white rounded-xl shadow-md p-6 border-2 border-indigo-300">
                    <h2 id="${prefix}-form-title" class="text-xl font-bold text-gray-800 mb-4">নতুন ডাটা এন্ট্রি</h2>
                    <input type="hidden" id="${prefix}-editRecordId" value="">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">টাইটেল <span class="text-red-500">*</span></label>
                            <input type="text" id="${prefix}-entryTitle" dir="auto" spellcheck="true" autocomplete="off" placeholder="টাইটেল লিখুন..." class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">পাসওয়ার্ড <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <input type="password" id="${prefix}-entryPassword" placeholder="পাসওয়ার্ড লিখুন..." class="w-full border rounded-lg px-3 py-2 pr-10 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <button type="button" onclick="togglePasswordVisibility('${prefix}-entryPassword', '${prefix}-eyeIcon')" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700">
                                    <svg id="${prefix}-eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ডেসক্রিপশন (ফরম্যাটেড টেক্সট)</label>
                            <div id="${prefix}-entryDescription" contenteditable="true" dir="auto" spellcheck="true" class="w-full border rounded-lg px-3 py-2 min-h-[120px] bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 overflow-y-auto" style="white-space: pre-wrap;"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">একাধিক ফাইল চুজ করুন (HTML, CSS, JS, Doc, PDF, Excel ইত্যাদি)</label>
                            <input type="file" id="${prefix}-entryFiles" multiple class="w-full border rounded-lg px-3 py-2 bg-gray-50">
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button onclick="submitData('${prefix}')" id="${prefix}-submitBtn" class="bg-green-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-green-700 transition">সেভ করুন</button>
                            <button onclick="resetForm('${prefix}')" id="${prefix}-cancelBtn" class="hidden bg-gray-500 text-white px-6 py-2 rounded-lg font-medium hover:bg-gray-600 transition">ক্যান্সেল</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.018 10.018 0 0113.122 13.122m-1.563 3.029A9.97 9.97 0 0112 19c-1.558 0-3.04-.355-4.364-1.002M3 3l18 18" />`;
            } else {
                input.type = "password";
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            }
        }

        function switchTab(tab) {
            document.getElementById('section-dashboard').classList.add('hidden');
            document.getElementById('section-dataentry').classList.add('hidden');
            document.getElementById('section-admin').classList.add('hidden');

            document.getElementById('btn-dashboard').className = "px-4 py-2 bg-blue-800 rounded transition font-medium";
            document.getElementById('btn-dataentry').className = "px-4 py-2 bg-blue-800 rounded transition font-medium";
            document.getElementById('btn-admin').className = "px-4 py-2 bg-blue-800 rounded transition font-medium";

            if (tab === 'dashboard') {
                document.getElementById('section-dashboard').classList.remove('hidden');
                document.getElementById('btn-dashboard').className = "px-4 py-2 bg-blue-700 rounded transition font-medium";
                loadDashboard();
            } else if (tab === 'dataentry') {
                document.getElementById('section-dataentry').classList.remove('hidden');
                document.getElementById('btn-dataentry').className = "px-4 py-2 bg-blue-700 rounded transition font-medium";
            } else if (tab === 'admin') {
                document.getElementById('section-admin').classList.remove('hidden');
                document.getElementById('btn-admin').className = "px-4 py-2 bg-blue-700 rounded transition font-medium";
            }
        }

        async function apiPost(payload) {
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            });
            return await res.json();
        }

        async function handleLogin() {
            const pass = document.getElementById('adminPassword').value;
            const res = await apiPost({ action: 'adminLogin', password: pass });
            if (res.success) {
                document.getElementById('admin-login-box').classList.add('hidden');
                document.getElementById('admin-panel-content').classList.remove('hidden');
                loadSummary();
            } else {
                alert(res.error);
            }
        }

        async function loadDashboard() {
            const container = document.getElementById('dashboard-list');
            container.innerHTML = `<p class="text-gray-500">লোড হচ্ছে...</p>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAllRecords&_=${Date.now()}`);
                const records = await res.json();
                allDataCache = Array.isArray(records) ? records.map(normalizeRecordForDisplay) : [];

                if (allDataCache.length === 0) {
                    container.innerHTML = `<p class="text-gray-500">কোনো ডাটা পাওয়া যায়নি।</p>`;
                    return;
                }

                container.innerHTML = '';
                allDataCache.forEach((item, index) => {
                    let filesHtml = '';
                    if (item.files && item.files.length > 0) {
                        item.files.forEach(f => {
                            filesHtml += `
                                <div class="flex justify-between items-center bg-gray-50 p-2 rounded mb-2 border">
                                    <span class="text-sm text-gray-700 truncate max-w-xs">${f.name}</span>
                                    <div class="flex gap-2">
                                        <a href="${f.downloadUrl}" target="_blank" class="bg-blue-500 text-white px-3 py-1 rounded text-xs font-medium hover:bg-blue-600">ডাউনলোড</a>
                                    </div>
                                </div>
                            `;
                        });
                    }

                    const hasDesc = item.description && item.description.trim() !== "";
                    const hasFiles = item.files && item.files.length > 0;
                    
                    container.innerHTML += `
                        <div class="border-2 border-indigo-300 hover:border-indigo-500 rounded-xl p-5 bg-white shadow-sm space-y-4 transition-all duration-200">
                            <div class="flex flex-wrap justify-between items-center gap-2">
                                <h3 class="font-bold text-lg text-gray-800">${item.title}</h3>
                                
                                <div class="flex items-center gap-2">
                                    ${(hasFiles || hasDesc) ? `<button onclick="downloadRecordZip('${item.id}', event)" class="bg-purple-600 text-white px-3 py-1 rounded text-xs font-medium hover:bg-purple-700">সব ফাইল ZIP ডাউনলোড</button>` : ''}
                                    
                                    <div class="inline-flex items-center">
                                        <input type="password" id="pass-input-${index}" placeholder="পাসওয়ার্ড..." oninput="verifyPassword(${index}, '${encodeURIComponent(item.password)}')" class="border border-gray-300 rounded px-2 py-1 text-xs w-28 focus:outline-none focus:border-red-500">
                                        <button id="delete-btn-${index}" onclick="confirmDeleteRecord('${item.id}')" class="hidden bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs font-medium transition">🗑️ ডিলিট</button>
                                    </div>
                                </div>
                            </div>
                            
                            ${hasDesc ? `
                            <div class="border rounded p-3 bg-gray-50 relative group">
                                <div class="cursor-pointer text-gray-700 text-sm line-clamp-3" onclick="openModal(${index})" style="white-space: pre-wrap;">${item.description}</div>
                                <div class="mt-2 flex justify-between items-center border-t pt-2">
                                    <button onclick="openModal(${index})" class="text-xs text-blue-600 font-medium hover:underline">সম্পূর্ণ ডেসক্রিপশন দেখুন...</button>
                                    <button onclick="copyFormattedText(event, ${index})" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded text-xs font-medium flex items-center gap-1 transition">
                                        <span id="copy-btn-${index}">📋 কপি টেক্সট</span>
                                    </button>
                                </div>
                            </div>` : ''}

                            ${filesHtml ? `<div class="pt-2">${filesHtml}</div>` : ''}
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = `<p class="text-red-500">ডাটা লোড করতে সমস্যা হয়েছে।</p>`;
            }
        }

        function verifyPassword(index, encodedPass) {
            const inputVal = document.getElementById(`pass-input-${index}`).value;
            const actualPass = decodeURIComponent(encodedPass);
            const passInput = document.getElementById(`pass-input-${index}`);
            const delBtn = document.getElementById(`delete-btn-${index}`);

            if (inputVal === actualPass && inputVal !== "") {
                passInput.classList.add('hidden');
                delBtn.classList.remove('hidden');
            } else {
                passInput.classList.remove('hidden');
                delBtn.classList.add('hidden');
            }
        }

        async function confirmDeleteRecord(id) {
            if (confirm('আপনি কি নিশ্চিত এই রেকর্ডটি গুগল শিট ও ড্রাইভ থেকে সম্পূর্ণ ডিলিট করতে চান?')) {
                const res = await apiPost({ action: 'deleteRecord', id: id });
                if (res.success) {
                    alert('সফলভাবে ডিলিট করা হয়েছে!');
                    loadDashboard();
                    if (!document.getElementById('admin-panel-content').classList.contains('hidden')) {
                        loadSummary();
                    }
                } else {
                    alert(res.error);
                }
            }
        }

        async function loadSummary() {
            const container = document.getElementById('summary-list');
            container.innerHTML = `<p class="text-gray-500">লোড হচ্ছে...</p>`;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=getAllRecords&_=${Date.now()}`);
                const records = await res.json();
                const safeRecords = Array.isArray(records) ? records.map(normalizeRecordForDisplay) : [];

                if (!safeRecords || safeRecords.length === 0) {
                    container.innerHTML = `<p class="text-gray-500">কোনো রেকর্ড নেই।</p>`;
                    return;
                }

                container.innerHTML = '';
                safeRecords.forEach(item => {
                    container.innerHTML += `
                        <div class="border rounded-xl p-4 bg-gray-50 flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-gray-800">${item.title}</h4>
                                <p class="text-xs text-gray-500">ফাইল সংখ্যা: ${item.files ? item.files.length : 0}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editRecord('${item.id}')" class="bg-yellow-500 text-white px-3 py-1 rounded text-xs font-medium hover:bg-yellow-600">Edit</button>
                                <button onclick="confirmDeleteRecord('${item.id}')" class="bg-red-500 text-white px-3 py-1 rounded text-xs font-medium hover:bg-red-600">Delete</button>
                            </div>
                        </div>
                    `;
                });
            } catch(e) {
                container.innerHTML = `<p class="text-red-500">ডাটা লোড করতে ব্যর্থ হয়েছে।</p>`;
            }
        }

        async function submitData(prefix) {
            // Title is plain text: never run ordinary English through a legacy converter.
            // Legacy/Bijoy text pasted from a font-aware source is converted by the
            // title paste handler only when the clipboard explicitly identifies a legacy font.
            const title = document.getElementById(`${prefix}-entryTitle`).value.trim();
            const password = document.getElementById(`${prefix}-entryPassword`).value.trim();
            // Always save Bengali content as real Unicode UTF-8.
            const description = await normalizeHTMLToUnicode(
                document.getElementById(`${prefix}-entryDescription`).innerHTML
            );
            const fileInput = document.getElementById(`${prefix}-entryFiles`);
            const editId = document.getElementById(`${prefix}-editRecordId`).value;

            if (!title) {
                alert('দয়া করে টাইটেল দিন।');
                return;
            }
            if (!password) {
                alert('পাসওয়ার্ড দেওয়া বাধ্যতামূলক! দয়া করে পাসওয়ার্ড দিন।');
                return;
            }

            const submitBtn = document.getElementById(`${prefix}-submitBtn`);
            submitBtn.innerText = "প্রসেসিং হচ্ছে...";
            submitBtn.disabled = true;

            const filesData = [];
            for (let i = 0; i < fileInput.files.length; i++) {
                const file = fileInput.files[i];
                const base64 = await toBase64(file);
                filesData.push({
                    name: file.name,
                    mimeType: file.type,
                    data: base64
                });
            }

            let res;
            if (editId) {
                res = await apiPost({
                    action: 'updateRecord',
                    id: editId,
                    title: title,
                    password: password,
                    description: description,
                    filesData: filesData
                });
            } else {
                res = await apiPost({
                    action: 'uploadFiles',
                    title: title,
                    password: password,
                    description: description,
                    filesData: filesData
                });
            }

            if (res.success) {
                alert('সফলভাবে সেভ করা হয়েছে!');
                resetForm(prefix);
                await loadDashboard();
                if (prefix === 'admin') {
                    loadSummary();
                }
            } else {
                alert(res.error || 'সেভ করতে সমস্যা হয়েছে।');
            }
            submitBtn.innerText = editId ? "আপডেট করুন" : "সেভ করুন";
            submitBtn.disabled = false;
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        function editRecord(id) {
            const item = allDataCache.find(r => r.id === id);
            if (item) {
                const prefix = 'admin';
                document.getElementById(`${prefix}-editRecordId`).value = item.id;
                document.getElementById(`${prefix}-entryTitle`).value = item.title || "";
                document.getElementById(`${prefix}-entryPassword`).value = item.password || "";
                document.getElementById(`${prefix}-entryDescription`).innerHTML = normalizeHTMLSync(item.description || "");
                document.getElementById(`${prefix}-form-title`).innerText = "ডাটা এডিট করুন";
                document.getElementById(`${prefix}-submitBtn`).innerText = "আপডেট করুন";
                document.getElementById(`${prefix}-cancelBtn`).classList.remove('hidden');
            }
        }

        function resetForm(prefix) {
            document.getElementById(`${prefix}-editRecordId`).value = '';
            document.getElementById(`${prefix}-entryTitle`).value = '';
            document.getElementById(`${prefix}-entryPassword`).value = '';
            document.getElementById(`${prefix}-entryDescription`).innerHTML = '';
            document.getElementById(`${prefix}-entryFiles`).value = '';
            document.getElementById(`${prefix}-form-title`).innerText = "নতুন ডাটা এন্ট্রি";
            document.getElementById(`${prefix}-submitBtn`).innerText = "সেভ করুন";
            document.getElementById(`${prefix}-cancelBtn`).classList.add('hidden');
        }

        let currentModalDesc = "";

        function openModal(index) {
            const item = allDataCache[index];
            document.getElementById('modalTitle').innerText = item.title || "";
            document.getElementById('modalBody').innerHTML = normalizeHTMLSync(item.description || "");
            currentModalDesc = normalizeHTMLSync(item.description || "");
            document.getElementById('descModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('descModal').classList.add('hidden');
        }

        function copyFormattedText(event, index) {
            event.stopPropagation();
            const item = allDataCache[index];
            copyToClipboard(item.description, `copy-btn-${index}`);
        }

        function copyModalContent() {
            copyToClipboard(currentModalDesc, 'modalCopyBtnText');
        }

        function copyToClipboard(htmlContent, btnId) {
            const blobHtml = new Blob([htmlContent], { type: 'text/html' });
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlContent;
            const plainText = tempDiv.innerText || tempDiv.textContent;
            const blobText = new Blob([plainText], { type: 'text/plain' });

            const data = [new ClipboardItem({
                'text/html': blobHtml,
                'text/plain': blobText
            })];

            navigator.clipboard.write(data).then(() => {
                const btn = document.getElementById(btnId);
                const originalText = btn.innerText;
                btn.innerText = "Copied!";
                setTimeout(() => {
                    btn.innerText = originalText;
                }, 2000);
            }).catch(() => {
                navigator.clipboard.writeText(plainText);
                const btn = document.getElementById(btnId);
                const originalText = btn.innerText;
                btn.innerText = "Copied!";
                setTimeout(() => {
                    btn.innerText = originalText;
                }, 2000);
            });
        }


        /* ================================================================
           UNIVERSAL TEXT / FONT FIDELITY ENGINE
           - English is NEVER converted.
           - Unicode Bengali is NEVER converted.
           - Legacy Bijoy/SutonnyMJ is converted only when legacy-font evidence
             exists in the pasted HTML, or when a strong legacy signature exists.
           - Existing rich-text HTML/style/font-family is preserved.
           - The same HTML is used for Dashboard + Preview.
           ================================================================ */

        let bijoyEngine = null;
        let bijoyEnginePromise = null;

        async function ensureBijoyEngine() {
            if (bijoyEngine) return bijoyEngine;
            if (!bijoyEnginePromise) {
                bijoyEnginePromise = import("https://esm.sh/bijoy2unicode@1.0.2")
                    .then(mod => {
                        bijoyEngine = mod;
                        return mod;
                    })
                    .catch(() => null);
            }
            return bijoyEnginePromise;
        }

        function hasBanglaUnicode(text) {
            return /[\u0980-\u09FF]/u.test(text || "");
        }

        function isPureEnglishOrCommonLatin(text) {
            if (!text) return false;
            // If the text contains only ordinary Latin letters, digits, whitespace
            // and common punctuation, it is English/Latin and MUST NOT be converted.
            return /^[A-Za-z0-9\s.,!?;:'"(){}\[\]<>@#$%&*+=_\/\\|~`^°•\-–—]+$/.test(text);
        }

        function getLegacyFontEvidence(element) {
            let el = element;
            while (el) {
                const styleFont = (el.getAttribute && el.getAttribute("style") || "").toLowerCase();
                const faceFont = (el.getAttribute && el.getAttribute("face") || "").toLowerCase();
                const className = (el.getAttribute && el.getAttribute("class") || "").toLowerCase();
                const dataFont = (el.getAttribute && (
                    el.getAttribute("data-font") ||
                    el.getAttribute("data-font-family") ||
                    el.getAttribute("data-original-font")
                ) || "").toLowerCase();

                const combined = `${styleFont} ${faceFont} ${className} ${dataFont}`;
                if (/(sutonny|bijoy|boishakhi|suleka|sutonnybangla|bijoyekattor|bijoy\s*52|omj|mj\s*font|amar\s*bangla|bangsee|bangla\s*font)/i.test(combined)) {
                    return true;
                }
                el = el.parentElement;
            }
            return false;
        }

        function legacyCharacterScore(text) {
            if (!text || hasBanglaUnicode(text) || isPureEnglishOrCommonLatin(text)) return 0;

            const chars = [...text];
            if (!chars.length) return 0;

            // These characters are especially common in Bijoy/SutonnyMJ ANSI text.
            const strongLegacy = /[†‡ˆ‰Š„…ƒ‚˜™š›œŸ¡¢£¤¥¦§¨©ª«¬®¯°±²³´µ¶·¸¹º»¼½¾¿ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖ×ØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòôõö÷øùúûüýþ]/;
            const count = chars.filter(c => strongLegacy.test(c)).length;
            return count / chars.length;
        }

        function looksLikeLegacyBijoy(text, element = null) {
            if (!text || hasBanglaUnicode(text)) return false;

            // Ordinary English must always pass through unchanged.
            if (isPureEnglishOrCommonLatin(text)) return false;

            // Strongest and safest signal: the source explicitly says it used a
            // legacy Bengali font.
            if (getLegacyFontEvidence(element)) return true;

            // For plain-text clipboard data where font metadata was stripped,
            // only convert when there are unmistakable legacy ANSI characters.
            return legacyCharacterScore(text) >= 0.08;
        }

        const BIJOY_FALLBACK_MAP = {
            "Av":"আ","A":"অ","B":"ই","C":"ঈ","D":"উ","E":"ঊ","F":"ঋ","G":"এ","H":"ঐ","I":"ও","J":"ঔ",
            "K":"ক","L":"খ","M":"গ","N":"ঘ","O":"ঙ","P":"চ","Q":"ছ","R":"জ","S":"ঝ","T":"ঞ","U":"ট","V":"ঠ",
            "W":"ড","X":"ঢ","Y":"ণ","Z":"ত","_":"থ","`":"দ","a":"ধ","b":"ন","c":"প","d":"ফ","e":"ব","f":"ভ",
            "g":"ম","h":"য","i":"র","j":"ল","k":"শ","l":"ষ","m":"স","n":"হ","o":"ড়","p":"ঢ়","q":"য়","r":"ৎ",
            "s":"ং","t":"ঃ","u":"ঁ","0":"০","1":"১","2":"২","3":"৩","4":"৪","5":"৫","6":"৬","7":"৭","8":"৮","9":"৯",
            "•":"ঙ্","v":"া","w":"ি","x":"ী","y":"ু","z":"ু","“":"ু","–":"ু","~":"ূ","ƒ":"ূ","‚":"ূ","„":"ৃ","…":"ৃ",
            "†":"ে","‡":"ে","ˆ":"ৈ","‰":"ৈ","Š":"ৗ","|":"।","\\|":"।","\\&":"্‌",
            "°":"ক্ক","±":"ক্ট","²":"ক্ষ্ণ","³":"ক্ত","´":"ক্ম","µ":"ক্র","¶":"ক্ষ","·":"ক্স","¸":"গু","¹":"জ্ঞ",
            "º":"গ্দ","»":"গ্ধ","¼":"ঙ্ক","½":"ঙ্গ","¾":"জ্জ","¿":"্ত্র","À":"জ্ঝ","Á":"জ্ঞ","Â":"ঞ্চ","Ã":"ঞ্ছ",
            "Ä":"ঞ্জ","Å":"ঞ্ঝ","Æ":"ট্ট","Ç":"ড্ড","È":"ণ্ট","É":"ণ্ঠ","Ê":"ণ্ড","Ë":"ত্ত","Ì":"ত্থ","Í":"ত্ম",
            "Î":"ত্র","Ï":"দ্দ","Ð":"ণ্ড","Ñ":"-","Ò":"\"","Ó":"\"","Ô":"'","Õ":"'","Ö":"্র","×":"দ্ধ","Ø":"দ্ব",
            "Ù":"দ্ম","Ú":"ন্ঠ","Û":"ন্ড","Ü":"ন্ধ","Ý":"ন্স","Þ":"প্ট","ß":"প্ত","à":"প্প","á":"প্স","â":"ব্জ",
            "ã":"ব্দ","ä":"ব্ধ","å":"ভ্র","æ":"ম্ন","ç":"ম্ফ","è":"্ন","é":"ল্ক","ê":"ল্গ","ë":"ল্ট","ì":"ল্ড",
            "í":"ল্প","î":"ল্ফ","ï":"শু","ð":"শ্চ","ñ":"শ্ছ","ò":"ষ্ণ","ó":"ষ্ট","ô":"ষ্ঠ","õ":"ষ্ফ","ö":"স্খ",
            "÷":"স্ট","ø":"স্ন","ù":"স্ফ","ú":"্প","û":"হু","ü":"হৃ","ý":"হ্ন","þ":"হ্ম",
            "®":"ষ্","¯":"স্","”":"চ্","˜":"দ্","™":"দ্","š":"ন্","›":"ন্","œ":"্ন","Ÿ":"্ব","¡":"্ব","¢":"্ভ",
            "£":"্ভ্র","¤":"ম্","¥":"্ম","¦":"্ব","§":"্ম","¨":"্য","©":"র্","ª":"্র","«":"্র","¬":"্ল","­":"্ল",
            "^":"্ব","‘":"্তু","’":"্থ","‹":"্ক","Œ":"্ক্র","—":"্ত"
        };

        function fallbackBijoyToUnicode(input) {
            if (!input || !looksLikeLegacyBijoy(input)) return input || "";
            let s = input;
            const pre = [
                ["yy","y"],["vv","v"],["­­","­"],["y&","y"],["„&","„"],
                ["‡u","u‡"],["wu","uw"],["uy","yu"],["u“","“u"],["u–","–u"],
                ["uƒ","ƒu"],["u‚","‚u"],["uv","vu"],["u…","…u"],["u„","„u"],
                ["uz","zu"],["ux","xu"],["u~","~u"]
            ];
            pre.forEach(([a,b]) => s = s.split(a).join(b));
            Object.keys(BIJOY_FALLBACK_MAP).sort((a,b)=>b.length-a.length).forEach(k => {
                s = s.split(k).join(BIJOY_FALLBACK_MAP[k]);
            });
            s = s.replace(/্+/g, "্");
            for (let i = 1; i < 4; i++) {
                s = s.replace(/([\u0995-\u09B9\u09DC\u09DD\u09DF\u09CE])র্/g, "র্$1");
            }
            s = s.replace(/([\u0995-\u09B9\u09DC\u09DD\u09DF\u09CE](?:্[\u0995-\u09B9\u09DC\u09DD\u09DF\u09CE])*)([িীেৈ])/g, "$2$1");
            s = s.replace(/ে([\u0995-\u09B9\u09DC\u09DD\u09DF\u09CE])া/g, "$1ো");
            s = s.replace(/ে([\u0995-\u09B9\u09DC\u09DD\u09DF\u09CE])ৗ/g, "$1ৌ");
            return s.normalize("NFC");
        }

        function convertBijoyTextIfNeeded(text, element = null) {
            if (!text || hasBanglaUnicode(text)) return text || "";
            if (!looksLikeLegacyBijoy(text, element)) return text;

            if (bijoyEngine && typeof bijoyEngine.convertBijoyToUnicode === "function") {
                try { return bijoyEngine.convertBijoyToUnicode(text); } catch(e) {}
            }
            return fallbackBijoyToUnicode(text);
        }

        async function convertBijoyText(text, element = null) {
            if (!text || hasBanglaUnicode(text) || !looksLikeLegacyBijoy(text, element)) return text || "";
            const engine = await ensureBijoyEngine();
            if (engine && typeof engine.convertBijoyToUnicode === "function") {
                try { return engine.convertBijoyToUnicode(text); } catch(e) {}
            }
            return fallbackBijoyToUnicode(text);
        }

        function normalizeHTMLSync(html) {
            if (!html) return "";
            const box = document.createElement("div");
            box.innerHTML = html;
            const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) nodes.push(walker.currentNode);
            nodes.forEach(node => {
                node.nodeValue = convertBijoyTextIfNeeded(node.nodeValue, node.parentElement);
            });
            return box.innerHTML;
        }

        async function normalizeHTMLToUnicode(html) {
            if (!html) return "";
            const box = document.createElement("div");
            box.innerHTML = html;
            const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) nodes.push(walker.currentNode);
            for (const node of nodes) {
                node.nodeValue = await convertBijoyText(node.nodeValue, node.parentElement);
            }
            return box.innerHTML;
        }

        function normalizeRecordForDisplay(item) {
            if (!item) return item;
            return {
                ...item,
                // Keep title exactly as stored; do not reinterpret English as Bijoy.
                title: item.title || "",
                // Preserve the exact rich-text HTML so Dashboard/Preview use the
                // same formatting/font information as the entry.
                description: normalizeHTMLSync(item.description || "")
            };
        }

        function clipboardHasLegacyFont(htmlText) {
            return /(sutonny|bijoy|boishakhi|suleka|sutonnybangla|bijoyekattor|omj|mj\s*font|bangsee)/i.test(htmlText || "");
        }

        function insertRichClipboardIntoEditable(el, clipboardHTML, clipboardText) {
            if (!el) return;

            if (clipboardHTML && clipboardHasLegacyFont(clipboardHTML)) {
                el.focus();
                const range = document.getSelection();
                if (range && range.rangeCount) {
                    range.deleteFromDocument();
                    const temp = document.createElement("div");
                    temp.innerHTML = clipboardHTML;
                    // Convert only text nodes whose source HTML identifies a legacy font.
                    const walker = document.createTreeWalker(temp, NodeFilter.SHOW_TEXT);
                    const nodes = [];
                    while (walker.nextNode()) nodes.push(walker.currentNode);
                    nodes.forEach(node => {
                        if (getLegacyFontEvidence(node.parentElement)) {
                            node.nodeValue = convertBijoyTextIfNeeded(node.nodeValue, node.parentElement);
                        }
                    });
                    const frag = document.createDocumentFragment();
                    while (temp.firstChild) frag.appendChild(temp.firstChild);
                    range.insertNode(frag);
                    range.collapse(false);
                    return;
                }
            }

            // Normal English/Unicode paste: browser inserts the original content,
            // preserving HTML formatting. No conversion is applied.
            document.execCommand("insertHTML", false, clipboardHTML || escapeHtml(clipboardText || ""));
        }

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value || "";
            return div.innerHTML;
        }

        function attachBanglaAutoConverter() {
            ["public-entryDescription","admin-entryDescription"].forEach(id => {
                const el = document.getElementById(id);
                if (!el || el.dataset.universalFontAttached) return;
                el.dataset.universalFontAttached = "1";

                el.addEventListener("paste", (event) => {
                    event.preventDefault();
                    const htmlText = event.clipboardData ? event.clipboardData.getData("text/html") : "";
                    const plainText = event.clipboardData ? event.clipboardData.getData("text/plain") : "";

                    // Let the source font decide whether legacy conversion is needed.
                    insertRichClipboardIntoEditable(el, htmlText, plainText);
                });

                // IMPORTANT: do not convert on blur. Blur conversion was the reason
                // ordinary English could previously become Bengali-looking text.
            });

            ["public-entryTitle","admin-entryTitle"].forEach(id => {
                const el = document.getElementById(id);
                if (!el || el.dataset.universalFontAttached) return;
                el.dataset.universalFontAttached = "1";

                el.addEventListener("paste", (event) => {
                    const htmlText = event.clipboardData ? event.clipboardData.getData("text/html") : "";
                    const plainText = event.clipboardData ? event.clipboardData.getData("text/plain") : "";

                    // Input fields cannot retain per-character font-family. If the
                    // clipboard explicitly identifies a legacy Bengali font, convert
                    // that pasted text. Otherwise preserve it byte-for-byte.
                    if (clipboardHasLegacyFont(htmlText) && plainText && !hasBanglaUnicode(plainText)) {
                        event.preventDefault();
                        const converted = convertBijoyTextIfNeeded(plainText);
                        const start = el.selectionStart ?? el.value.length;
                        const end = el.selectionEnd ?? el.value.length;
                        el.value = el.value.slice(0, start) + converted + el.value.slice(end);
                        const pos = start + converted.length;
                        el.setSelectionRange(pos, pos);
                    }
                });
            });
        }

        const originalRenderDataEntryForm = renderDataEntryForm;
        renderDataEntryForm = function(containerId, prefix) {
            originalRenderDataEntryForm(containerId, prefix);
            attachBanglaAutoConverter();
        };

        async function downloadRecordZip(id, event) {
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "ZIP তৈরি হচ্ছে...";
            btn.disabled = true;

            try {
                const res = await apiPost({ action: 'downloadZip', id: id });

                if (res.success && res.base64) {
                    const byteCharacters = atob(res.base64);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: 'application/zip' });

                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = res.filename || "files.zip";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                } else {
                    alert(res.error || "ZIP তৈরিতে সমস্যা হয়েছে।");
                }
            } catch (err) {
                alert("ZIP ডাউনলোড করতে সমস্যা হয়েছে: " + err.toString());
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
